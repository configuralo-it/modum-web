name: MOD-WEB-001 — Build, Deploy & Review

on:
  push:
    branches:
      - feat/mod-web-001
    paths-ignore:
      - 'review/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: modum-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify & Build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Verify export
        run: |
          test -f out/index.html
          test -d out/_next
          echo "Static export verified."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: modum-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  review:
    name: Post-deploy Review
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15

    steps:
      - name: Checkout review target
        uses: actions/checkout@v4
        with:
          ref: feat/mod-web-001

      - name: Wait for edge propagation
        run: sleep 8

      - name: HTTP smoke test
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          echo "Reviewing: $PAGE_URL"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$PAGE_URL" -o /tmp/modum-preview.html
          test -s /tmp/modum-preview.html
          grep -q "Modum" /tmp/modum-preview.html
          echo "HTTP smoke test passed."

      - name: Lighthouse audit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p review
          npx --yes lighthouse@12 "$PAGE_URL"             --quiet             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"             --only-categories=performance,accessibility,best-practices,seo             --output=json             --output-path=review/lighthouse.json

          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('review/lighthouse.json', 'utf8'));
          const c = report.categories;
          const scores = {
            performance: Math.round(c.performance.score * 100),
            accessibility: Math.round(c.accessibility.score * 100),
            bestPractices: Math.round(c['best-practices'].score * 100),
            seo: Math.round(c.seo.score * 100),
          };
          fs.writeFileSync('review/lighthouse-summary.json', JSON.stringify(scores, null, 2) + '\n');
          console.log('MODUM_REVIEW ' + JSON.stringify(scores));
          NODE

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture live desktop and mobile
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,1000"             --full-page             "$PAGE_URL?review=1"             review/latest-desktop.png

          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "390,844"             --full-page             "$PAGE_URL?review=1"             review/latest-mobile.png

          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,900"             "$PAGE_URL?review=1"             review/hero-desktop.jpeg

          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "390,844"             "$PAGE_URL?review=1"             review/hero-mobile.jpeg

          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,900"             "$PAGE_URL?review=1#work"             review/work-desktop.jpeg

          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,900"             "$PAGE_URL?review=1#approach"             review/approach-desktop.jpeg

          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,900"             "$PAGE_URL?review=1#contact"             review/contact-desktop.jpeg

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: modum-live-review-${{ github.sha }}
          path: |
            review/lighthouse.json
            review/lighthouse-summary.json
            review/latest-desktop.png
            review/latest-mobile.png
            review/hero-desktop.jpeg
            review/hero-mobile.jpeg
            review/work-desktop.jpeg
            review/approach-desktop.jpeg
            review/contact-desktop.jpeg
          retention-days: 14
          if-no-files-found: error

      - name: Enforce review thresholds
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const scores = JSON.parse(fs.readFileSync('review/lighthouse-summary.json', 'utf8'));
          const minimums = {
            performance: 70,
            accessibility: 90,
            bestPractices: 90,
            seo: 90,
          };
          const failures = Object.entries(minimums)
            .filter(([key, min]) => scores[key] < min)
            .map(([key, min]) => `${key}=${scores[key]} (<${min})`);
          if (failures.length) {
            console.error('Review thresholds not met: ' + failures.join(', '));
            process.exit(1);
          }
          NODE
